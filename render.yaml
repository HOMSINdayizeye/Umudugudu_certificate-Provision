# Render Blueprint: deploys the Django backend from the backend/ folder.
# In the Render dashboard choose "New → Blueprint", pick this repository, and Render reads this file.
services:
  - type: web
    name: certify-backend
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn certify.wsgi:application --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/locations/provinces/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # paste the Neon connection string in the dashboard
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # the frontend URL, e.g. https://certify-frontend.vercel.app
      - key: WEB_CONCURRENCY
        value: "2"
    # Uploaded files and generated letters need somewhere permanent to live.
    # Either attach a Render Disk (paid plans) and uncomment the block below,
    # or set the STORAGE_* variables for an S3-compatible bucket (see backend/.env.example).
    # disk:
    #   name: certify-media
    #   mountPath: /var/data
    #   sizeGB: 1
    # envVars would then also include:
    #   - key: MEDIA_ROOT
    #     value: /var/data/media
