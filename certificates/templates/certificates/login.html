
{% extends 'certificates/base.html' %}
{% load static %}


{% block content %}
<style>
  .login-background {
   background-image: url("{% static 'certificates/images/login-bg.jpg' %}");
    background-size: cover;
    background-position: center;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 200px;
  }
  .login-card {
  background: rgba(255, 255, 255, 0.60);
  padding: 60px;
  margin: 0 auto;
  border-radius: 12px;
  max-width: 700px;
  width: 100%;
  box-sizing: border-box;
}


  /* .login-card {
      background: rgba(255, 255, 255,0.60);
      padding: 120px;
      margin: 80px auto;
      display: relative;
      border-radius: 14px;
      max-width: 700px;
      width: 100%;
      height: 700px;
  } */
  .login-card, input {
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      border: 1px solid skyblue
  }
</style>

<div class="login-background">
  <div class="login-card">
    <h3 class="text-center mb-4">Login</h3>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>
  </div>
</div>
{% endblock %}
