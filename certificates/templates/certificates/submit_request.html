{% extends 'certificates/base.html' %}
{% block content %}
<h2>Submit Request</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary" type="submit">Submit</button>
</form>
<button onclick="window.history.back()" style="
  background-color: #4CAF50;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 5px;
  font-size: 16px;
  cursor: pointer;
">
  ← Back
</button>

{% endblock %}
